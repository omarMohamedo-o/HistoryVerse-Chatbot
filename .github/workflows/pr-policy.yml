name: PR Policy Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  validate-pr:
    name: Validate PR & Commit Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Commit Messages and Check for Forbidden Attribution
        run: |
          VALID_TYPES="feat|fix|docs|test|ci|refactor|chore|perf|build|revert"
          COMMITS=$(git log --no-merges origin/${{ github.base_ref }}..HEAD --pretty=format:"%H %s")

          FAILED=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            HASH=$(echo "$line" | cut -d' ' -f1)
            SUBJECT=$(echo "$line" | cut -d' ' -f2-)

            if ! echo "$SUBJECT" | grep -qE "^($VALID_TYPES): .+"; then
              echo "::error::Commit $HASH subject does not follow 'type: summary' pattern: '$SUBJECT'"
              FAILED=1
            fi

            BODY=$(git log -n 1 --pretty=format:"%b" "$HASH")
            if echo "$BODY" | grep -qiE "(co-authored-by:|assistant|claude|gemini|deepmind|chatgpt|openai-bot)"; then
              echo "::error::Commit $HASH contains prohibited AI attribution trailer or mention."
              FAILED=1
            fi
          done <<< "$COMMITS"

          if [ $FAILED -ne 0 ]; then
            exit 1
          fi

      - name: Check PR Body for Prohibited Attribution
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          if echo "$PR_BODY" | grep -qiE "(co-authored-by|generated by ai|assistant)"; then
            echo "::error::PR body contains prohibited AI attribution."
            exit 1
          fi
