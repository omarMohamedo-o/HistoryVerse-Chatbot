[project]
name = "agent"
version = "0.1.0"
description = "Agent - Domain-Agnostic, Multi-Provider Multimodal AI Agent Framework"
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [{name = "Omar Mohamed", email = "omarmo.abdelsalam@gmail.com"}]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "structlog>=24.0.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.12",
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "chromadb>=0.5.0",
    "langchain-chroma>=0.1.0",
    "litellm>=1.48.0",
]

[project.optional-dependencies]
gemini = [
    "google-generativeai>=0.8.0",
    "langchain-google-genai>=2.0.0",
]

openai = [
    "openai>=1.40.0",
]

local = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.25.0",
    "sentence-transformers>=3.0.0",
    "llama-cpp-python>=0.3.0",
    "auto-gptq>=0.7.0",
]

voice = [
    "SpeechRecognition>=3.10.0",
    "faster-whisper>=1.0.0",
    "gTTS>=2.5.0",
    "langid>=1.1.0",
    "pyaudio>=0.2.14",
    "pygame>=2.5.0",
    "pyttsx3>=2.90",
]

evaluation = [
    "ragas>=0.1.0",
    "datasets>=2.14.0",
    "langfuse>=2.50.0",
]

experiments = [
    "mlflow>=2.15.0",
]

monitoring = [
    "prometheus-client>=0.20.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

loaders = [
    "docx2txt>=0.8",
    "unstructured>=0.14.0",
    "pypdf>=4.0.0",
]

dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "respx>=0.21.0",
]

all = [
    "agent[gemini,openai,local,voice,evaluation,experiments,monitoring,loaders,dev]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "evals"]
extend-exclude = [
    "Streamlit_UI",
    "extracted",
    "dataset",
    "models",
    "outputs",
    "DB",
]


[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
filterwarnings = [
    "ignore:.*langchain-community is being sunset.*:DeprecationWarning",
    "ignore::DeprecationWarning:langchain_community.*",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]
