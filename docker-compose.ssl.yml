services:
  nginx:
    image: nginx:alpine
    container_name: historyverse-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - historyverse-network
    depends_on:
      - historyverse-api

  certbot:
    image: certbot/certbot:latest
    container_name: historyverse-certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - historyverse-network

networks:
  historyverse-network:
    external: true

volumes:
  certbot_conf:
  certbot_www:
