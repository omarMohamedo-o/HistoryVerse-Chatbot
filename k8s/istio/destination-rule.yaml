apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: historyverse-destination-rule
  namespace: default
spec:
  host: historyverse-api
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
