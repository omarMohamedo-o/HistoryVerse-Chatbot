services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: agent-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - agent-network

  loki:
    image: grafana/loki:3.0.0
    container_name: agent-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./configs/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - agent-network

  promtail:
    image: grafana/promtail:3.0.0
    container_name: agent-promtail
    restart: unless-stopped
    volumes:
      - ./configs/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - agent-network

  grafana:
    image: grafana/grafana:11.0.0
    container_name: agent-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - agent-network
    depends_on:
      - prometheus
      - loki

  disk-guardian:
    build:
      context: ./services/disk-guardian
      dockerfile: Dockerfile
    image: agent-disk-guardian:latest
    container_name: agent-disk-guardian
    restart: unless-stopped
    environment:
      - HOST_MOUNT=/host
      - CHECK_INTERVAL_SECONDS=300
      - DISK_WARN_PCT=85
      - DISK_CRIT_PCT=90
      - PRUNE_UNTIL_HOURS=24
      - ALERTMANAGER_URL=http://prometheus:9090
      - OUTPUTS_DIR=/app/outputs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro
      - ./outputs:/app/outputs
    networks:
      - agent-network

networks:
  agent-network:
    external: true

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
