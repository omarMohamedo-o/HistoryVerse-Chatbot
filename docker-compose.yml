services:
  historyverse-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: historyverse-api:latest
    container_name: historyverse-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./dataset:/app/dataset:ro
      - ./DB:/app/DB
      - ./models:/app/models
      - ./outputs:/app/outputs
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  chromadb:
    image: chromadb/chroma:latest
    container_name: historyverse-chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./DB:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
