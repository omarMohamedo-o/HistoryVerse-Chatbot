groups:
  - name: agentverse_alerts
    rules:
      - alert: HighModelDriftRate
        expr: rate(agentverse_drift_events_total[5m]) > 0.2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High Model Drift Rate Detected"
          description: "AgentVerse is experiencing persistent low accuracy drift triggering retries."

      - alert: ServiceDegraded
        expr: up{job="agentverse-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AgentVerse API is down"
          description: "Target agentverse-api:8000 is unreachable."
