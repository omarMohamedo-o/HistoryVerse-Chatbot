groups:
  - name: agent_alerts
    rules:
      - alert: HighModelDriftRate
        expr: rate(agent_drift_events_total[5m]) > 0.2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High Model Drift Rate Detected"
          description: "Agent is experiencing persistent low accuracy drift triggering retries."

      - alert: ServiceDegraded
        expr: up{job="agent-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Agent API is down"
          description: "Target agent-api:8000 is unreachable."
